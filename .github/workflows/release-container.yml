name: Release Container

# Publishes ghcr.io/bbockelm/golang-ccb.
#
# Separate from release.yml on purpose: that one cuts a GitHub release of
# binaries and RPMs on a v* tag and nothing else. Containers are also wanted
# from main, because the Kubernetes deployments that consume this image follow
# a moving tag under flux image automation and would otherwise have nothing to
# follow between releases.
#
# Tags produced:
#   devel                 every push to main (a convenience tag; it moves)
#   main-<UTC timestamp>  every push to main -- what flux ImagePolicy orders on
#   vX.Y.Z                a v* tag
#   latest                a v* tag, as well
#
# A timestamp tag rather than `devel` is what a deployment should follow: a
# moving tag leaves no record in git of which build is actually running.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile cross-compiles with GOOS/GOARCH on the build platform,
      # so nothing here is actually emulated. QEMU is still registered because
      # buildx inspects the target platform when it assembles the manifest
      # list, and the distroless runtime stage is pulled per architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=devel,enable={{is_default_branch}}
            type=raw,value=main-{{date 'YYYYMMDDHHmmss' tz='UTC'}},enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image runs as `nonroot` out of a distroless base with no shell, so
      # there is no `docker run ... sh -c` smoke test available. `-carrier-check`
      # against an unreachable next hop is the cheapest thing that proves the
      # binary in the published image execs and parses its flags: it exits
      # non-zero on the connection, so only the "did not exec at all" failure
      # is distinguished -- which is precisely the failure a cross-build or a
      # stray cgo dependency would introduce.
      - name: Smoke-test the amd64 image
        env:
          # Multi-line; the first is enough to name the image just pushed.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -uo pipefail
          image="$(printf '%s\n' "${TAGS}" | head -n1)"
          echo "smoke-testing ${image}"
          out="$(docker run --rm --platform linux/amd64 "${image}" \
            -listen 127.0.0.1:0 -carrier-check 2>&1 || true)"
          echo "${out}"
          # Any output at all means the binary ran. An exec failure prints a
          # loader error from the runtime, not from htc-ccb.
          case "${out}" in
            *"exec format error"*|*"no such file or directory"*|"")
              echo "::error::htc-ccb did not exec in the published image"
              exit 1
              ;;
          esac
