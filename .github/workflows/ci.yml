name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # No base-branch filter: a PR stacked on another branch needs CI as much as
    # one targeting main, and filtering on main silently gave stacked PRs no
    # checks at all.
  schedule:
    # Nightly, for the container tier: it needs a real proxy and real
    # containers, which is too slow to put in front of every push.
    - cron: '27 5 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # First entry is the floor named in go.mod (1.26, the oldest
        # release upstream still supports); testing there is what keeps
        # that floor honest. Last entry is the newest release, which is
        # what builds and ships.
        go-version: ['1.26', '1.27']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install HTCondor
      run: |
        # The CCB-under-condor_master integration test needs the HTCondor
        # daemons and tools (condor_master, condor_submit, condor_wait) on PATH;
        # without them it skips. Install the pool binaries from the HTCondor repo.
        wget -qO - https://research.cs.wisc.edu/htcondor/repo/keys/HTCondor-25.x-Key | sudo gpg --dearmor -o /usr/share/keyrings/htcondor-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/htcondor-archive-keyring.gpg] http://research.cs.wisc.edu/htcondor/repo/ubuntu/25.x $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/htcondor.list
        sudo apt-get update
        sudo apt-get install -y condor

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@latest

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      # The integration test runs a personal HTCondor pool and a job through the
      # Go CCB; give it room. Unit tests run under the race detector.
      run: gotestsum --junitfile=test-results.xml -- -race -timeout=15m -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      if: matrix.go-version == '1.27'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version: '1.27'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        check-latest: true
        go-version: '1.27'
        cache: true

    - name: Build
      run: go build -v ./...

    - name: Build the golang-ccb binary
      run: go build -v -o golang-ccb ./cmd/golang-ccb

  squid-e2e:
    name: Squid end-to-end
    runs-on: ubuntu-latest
    # The fast tiers run on every push and cover the protocol. This one stands up
    # containers and a real proxy, so it runs where it earns its minutes: when the
    # carrier or its tests change, nightly, and on request.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'squid-e2e')
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run the tunneled-EP suite against a real squid
      working-directory: test/e2e-squid
      # --exit-code-from makes the harness container's status the job's status,
      # and tears the rest down when it finishes either way.
      run: |
        docker compose up --build \
          --abort-on-container-exit \
          --exit-code-from ep

    - name: Proxy and broker logs
      if: always()
      working-directory: test/e2e-squid
      # On a failure the harness's own output says which assertion went, but not
      # why; squid's access log and the brokers' logs are where the answer is.
      run: |
        echo "::group::squid"
        docker compose logs --no-color squid || true
        echo "::endgroup::"
        echo "::group::offsite broker"
        docker compose logs --no-color offsite || true
        echo "::endgroup::"
        echo "::group::squid access.log"
        docker compose run --rm --no-deps --entrypoint cat ep /squidlogs/access.log || true
        echo "::endgroup::"

    - name: Tear down
      if: always()
      working-directory: test/e2e-squid
      run: docker compose down -v --remove-orphans || true
