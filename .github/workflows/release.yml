name: Release

# Builds golang-ccb for linux and darwin (amd64 + arm64), packages an RPM per
# Linux architecture, and attaches everything to the GitHub release when a v*
# tag is pushed.
#
# A manual run (workflow_dispatch) builds and uploads the same artifacts as a
# workflow artifact WITHOUT publishing a release, so the packaging can be
# exercised without cutting a tag.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build binaries, RPMs and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rpm-version.sh falls back to `git describe` and the release notes
          # are generated from history, so a shallow clone is not enough.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          # The newest release, which is what ships. The go.mod floor is
          # exercised by CI, not here.
          go-version: '1.27'
          cache: true

      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            # A dispatch from a branch is not a release; mark the artifacts so
            # one cannot be mistaken for one.
            version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build binaries (linux, darwin; amd64, arm64)
        env:
          # The daemon ships onto worker nodes whose glibc is older than this
          # runner's, so every artifact is a static, cgo-free binary. The check
          # below reads the binaries rather than trusting this line.
          CGO_ENABLED: '0'
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="golang-ccb_${VERSION}_${os}_${arch}"
            echo "==> building ${name}"
            stage="dist/${name}"
            mkdir -p "${stage}"
            GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "-s -w" \
              -o "${stage}/golang-ccb" ./cmd/golang-ccb
            cp README.md docs/ADMIN_TUNNELING.md "${stage}/"
            cp packaging/golang-ccb.conf "${stage}/golang-ccb.conf.example"
          done
          ls -l dist

      # Reads the build settings recorded in each binary, so a step that lost
      # CGO_ENABLED fails here instead of on an administrator's worker node.
      - name: Check every binary is static and cgo-free
        run: packaging/check-static.sh dist/golang-ccb_*/golang-ccb

      - name: Package tarballs
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for d in dist/golang-ccb_*/; do
            name="$(basename "${d}")"
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            rm -rf "${d}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -l dist

      - name: Install nfpm (version pinned in .github/tools)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd .github/tools && GOWORK=off go build -o "$RUNNER_TEMP/bin/nfpm" github.com/goreleaser/nfpm/v2/cmd/nfpm)

      # The administrators who deploy this manage software with RPMs, so a
      # release carries one per Linux architecture alongside the tarballs.
      # Linux only: an RPM of a Darwin binary would install and not run.
      - name: Build RPMs (amd64, arm64)
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags "-s -w" \
              -o "build/golang-ccb-${arch}" ./cmd/golang-ccb
            NFPM="$RUNNER_TEMP/bin/nfpm" \
              packaging/build-rpm.sh "build/golang-ccb-${arch}" "${arch}" "${VERSION}" dist
          done
          (cd dist && sha256sum *.rpm >> SHA256SUMS.txt)
          ls -l dist/*.rpm

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golang-ccb-release
          path: dist/*
          if-no-files-found: error

      # Only on a v* tag. Uses the runner's built-in gh CLI -- no third-party
      # action. A tag with a pre-release suffix (v1.0.0-rc1) is marked as one.
      - name: Publish release with binaries and RPMs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(dist/*.tar.gz dist/*.rpm dist/SHA256SUMS.txt)
          # Idempotent: attach to an existing release (one made by hand, or a
          # re-run) instead of failing. --clobber makes re-runs safe.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} exists; uploading assets (clobbering any existing)."
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            prerelease=""
            case "${tag}" in
              *-*) prerelease="--prerelease" ;;
            esac
            # Draft, not published: publishing is a separate, human act.
            gh release create "${tag}" "${assets[@]}" \
              --draft \
              --title "${tag}" \
              --generate-notes \
              ${prerelease}
          fi
