# htc-ccb, the HTCondor connection broker.
#
# This file is %config(noreplace): your edits survive an upgrade, and the
# package's version of the file is written alongside as .rpmnew.
#
# Everything below is commented out. Uncomment what you need; a package that
# started a daemon on install would change the behaviour of the pool it was
# added to.

# --- daemon under the master -----------------------------------------------
CCB = /usr/sbin/htc-ccb
#DAEMON_LIST    = $(DAEMON_LIST), CCB
#DC_DAEMON_LIST = $(DC_DAEMON_LIST) +CCB

# -public is the address peers put in their CCB contacts, so it has to be the
# one they can reach -- not a wildcard, and not a private address if the EPs
# are elsewhere.
#CCB_ARGS = -listen :9618 -public ccb.example.org:9618

# --- logging ---------------------------------------------------------------
CCB_LOG     = $(LOG)/CcbLog
MAX_CCB_LOG = 10000000
#CCB_DEBUG   = D_FULLDEBUG D_SECURITY

# --- replacing the collector's built-in CCB --------------------------------
# A pool needs one broker, not two. If this daemon is the pool's CCB, turn the
# collector's off; if you are adding this one alongside an existing collector
# CCB for a subset of machines, leave it on and point only those machines here.
#ENABLE_CCB_SERVER = False

# --- what registers and what may ask ---------------------------------------
# CCB_REGISTER is authorized at DAEMON (the daemons that register themselves),
# CCB_REQUEST at READ (whoever wants to reach one). The defaults inherited from
# the pool configuration are usually right; narrow them here if not.
#ALLOW_DAEMON = ...
#ALLOW_READ   = ...
# condor_reconfig of this daemon is authorized at ADMINISTRATOR.
#ALLOW_ADMINISTRATOR_CCB = $(ALLOW_ADMINISTRATOR)

# --- surviving a restart ---------------------------------------------------
# Registered targets keep their CCBID, and clients resume security sessions,
# across a broker restart. Without this both are lost and every EP re-registers
# under a new contact. Naming the file in VALID_SPOOL_FILES keeps condor_preen
# from removing something it does not recognise.
#CCB_SESSION_CACHE_FILE = $(SPOOL)/htc-ccb-sessions.db
#VALID_SPOOL_FILES      = $(VALID_SPOOL_FILES) htc-ccb-sessions.db*

# --- dial policy -----------------------------------------------------------
# Refuse reverse connects to loopback and link-local addresses. The address is
# supplied by the requester, so this is worth turning on wherever the brokered
# daemons are not all trusted. (The outbound proxy refuses them regardless.)
#CCB_DIAL_REFUSE_LOCAL_ADDRESSES = true

# A reconnecting target must come from the IP it registered from. Set this only
# where targets legitimately change address, e.g. behind a NAT pool.
#CCB_RECONNECT_ALLOWED_FROM_ANY_IP = false

# --- rate limits -----------------------------------------------------------
# On by default with per-host values a well-behaved host does not reach. Give
# networks their own limits with classes; see docs/RATE_LIMITS.md.
#CCB_LIMIT_CLASSES                 = OFFSITE
#CCB_LIMIT_OFFSITE_NETWORKS        = 0.0.0.0/0, ::/0
#CCB_LIMIT_OFFSITE_REQUEST_RATE    = 5
#CCB_LIMIT_OFFSITE_REQUEST_BURST   = 50
#CCB_LIMIT_OFFSITE_MAX_SPLICES     = 50
#CCB_LIMIT_BANDWIDTH_TOTAL_RATE    = 1G

# --- tunneling an EP with no outbound network ------------------------------
# Only for the broker pair described in ADMIN_TUNNELING.md; an ordinary CCB
# needs none of it.
#
# On the broker beside the pool (the "outside" broker):
#CCB_CARRIER_LISTEN            = wss://0.0.0.0:443/ccb/tunnel
#CCB_CARRIER_TLS_CERT          = /etc/condor/ccb/tls.crt
#CCB_CARRIER_TLS_KEY           = /etc/condor/ccb/tls.key
#CCB_OUTBOUND_PROXY            = true
#CCB_OUTBOUND_TARGET_ALLOWLIST = collector.example.org, *.ap.example.org
#
# On the broker on the worker node (the "inside" broker):
#CCB_OUTBOUND_NEXT_HOP   = wss://ccb.example.org:443/ccb/tunnel
#CCB_CARRIER_PROXY       = http://squid.site.example:3128
#CCB_CARRIER_CA_FILE     = /etc/condor/ccb/ca.crt
#CCB_OUTBOUND_PROXY      = true
#CCB_TUNNEL_READY_FILE   = $(LOG)/ccb-tunnel-ready

# --- carrying the tunnel over SSH (or any other command) -------------------
# The carrier can be a command whose stdin and stdout are the pipe, which is
# how a node that may reach only a bastion on port 22 still tunnels. The
# command is executed directly, NOT through a shell: quoting works, but
# pipelines, redirection and $VARIABLES do not, and an unquoted shell
# metacharacter is refused rather than passed through as a literal argument.
# See docs/TRANSPORTS.md section 5.
#
# Relay through a bastion with nothing of ours installed on it. The outside
# broker accepts the raw pipe; `ssh -W` is what carries it there.
#   on the outside broker:
#CCB_CARRIER_LISTEN    = tcp://127.0.0.1:9700
#   on the inside broker:
#CCB_OUTBOUND_NEXT_HOP = cmd:ssh -W outside-ccb.example.org:9700 bastion.site.edu
#
# A tcp:// carrier has no TLS and no transport credential (identity still comes
# from the CEDAR handshake, as with CCB_CARRIER_AUTH = none), so keep it behind
# the SSH tunnel, a VPN or a firewall -- not on a public address.
#
# Or run our binary at the far end, which is what -carrier-stdio starts:
#CCB_OUTBOUND_NEXT_HOP = cmd:ssh bastion.site.edu htc-ccb -carrier-stdio
#
# The reverse is also possible: the OUTSIDE broker reaches into a network it
# cannot dial into, and the broker it starts there is the inside one.
#   on the outside broker:
#CCB_CARRIER_LISTEN    = cmd:ssh login.cluster.edu htc-ccb -carrier-stdio
#
# The child inherits this daemon's environment, which is how ssh finds HOME
# (and so ~/.ssh/config and known_hosts), SSH_AUTH_SOCK and KRB5CCNAME. Add to
# or override it here; note the broker usually runs as the condor user.
#CCB_CARRIER_COMMAND_ENV   = HOME=/var/lib/condor
#CCB_CARRIER_COMMAND_DIR   = /var/lib/condor
#CCB_CARRIER_COMMAND_GRACE = 2
#
# How fast an outside broker retries a carrier it obtains by reaching out.
# Seconds; the ceiling is deliberately slow, because a broker spawning an ssh
# per second against a site's bastion looks like an attack.
#CCB_CARRIER_RETRY_INITIAL = 1
#CCB_CARRIER_RETRY_MAX     = 60

# --- the broker speaks SSH itself (zero touch) -----------------------------
# ssh:// opens the session in-process rather than running the system ssh. It
# can then put htc-ccb on a host that has nothing, and route a login that
# needs a password or a one-time code to an administrator. What it gives up is
# everything ssh_config does for free -- ControlMaster, Match, certificates,
# GSSAPI -- so a site that needs those should keep using cmd:. ProxyJump is
# the exception and is supported here. See docs/TRANSPORTS.md section 6.
#CCB_CARRIER_LISTEN           = ssh://ccb@login.cluster.edu
#CCB_CARRIER_SSH_IDENTITY     = /etc/condor/ccb/id_ed25519
#CCB_CARRIER_SSH_AGENT        = false
#
# Bastion hops, nearest first, as ssh -J takes them. Every hop is verified
# against the host keys below, the same as the destination: a bastion sees
# everything the carrier carries.
#CCB_CARRIER_SSH_PROXY_JUMP   = ccb@bastion.cluster.edu
#
# Where to put the binary, and which one. The remote copy is named after its
# content hash, so a host that already has this build is left alone rather
# than being sent 22 MB again on every reconnect.
#CCB_CARRIER_SSH_STAGE_BINARY = /usr/sbin/htc-ccb-splice
#CCB_CARRIER_SSH_REMOTE_DIR   = ~/.cache/htc-ccb
#
# For a fleet that is not all one architecture: a directory of builds named
# htc-ccb-splice-<os>-<arch>, chosen by what the far host reports. Used
# instead of CCB_CARRIER_SSH_STAGE_BINARY.
#
# Not needed for the far hosts that share this broker's platform: it can stage
# the binary it is already running, told to be a relay with -carrier-splice.
#
# htc-ccb-splice is a byte relay: it accepts connections on the far host and
# copies each onto its own stream of the carrier. On linux/amd64 it is 1.43 MB
# gzipped against the full broker's 6.6 MB, and that difference crosses the
# network on every host that has not seen the build. A directory of
# htc-ccb-<os>-<arch> works too -- it is run as `htc-ccb -carrier-splice`, the
# same relay in a larger file -- and with both present the helper is sent.
#CCB_CARRIER_SSH_STAGE_BINARY_DIR = /usr/share/htc-ccb/remote
#
# The address the staged helper accepts connections on -- what daemons on that
# host name as their CCB. Unset leaves the helper's own default.
#
# There is no configuration to stage alongside it. The helper reads none: it
# terminates nothing, authenticates nobody and holds no credentials, so the
# authorization boundary stays here, at this broker.
#CCB_CARRIER_SSH_HELPER_LISTEN = 127.0.0.1:9700
#
# Or run a helper the site installed its own way, instead of staging one.
#CCB_CARRIER_SSH_COMMAND      = /usr/sbin/htc-ccb-splice -listen 127.0.0.1:9700
#
# Host keys. One of these is REQUIRED: there is no setting that accepts an
# unverified key, because a carrier hands the whole tunnel to whatever answers
# that address. The first failed connection prints the fingerprint it saw and
# the exact line to add.
#CCB_CARRIER_SSH_KNOWN_HOSTS  = /etc/condor/ccb/known_hosts
#
# The same line inline, for a container or anything else with no durable
# filesystem -- and for a fleet, where one config push beats editing a file on
# every broker. Comma-separated, because a known_hosts line contains spaces.
#CCB_CARRIER_SSH_HOST_KEY     = login.cluster.edu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5...
#
# A login that needs a person: the broker parks rather than retrying (the
# server would ask the same question forever, and a bastion that counts failed
# logins would lock the account). An administrator finishes it with
#   htc-ccb -finish-login <this broker's address>
# which also releases the carrier. Seconds that administrator waits for the
# question to arrive once attached.
#CCB_OPERATOR_WAIT            = 120
