# htc-ccb, the HTCondor connection broker.
#
# This file is %config(noreplace): your edits survive an upgrade, and the
# package's version of the file is written alongside as .rpmnew.
#
# Everything below is commented out. Uncomment what you need; a package that
# started a daemon on install would change the behaviour of the pool it was
# added to.

# --- daemon under the master -----------------------------------------------
CCB = /usr/sbin/htc-ccb
#DAEMON_LIST    = $(DAEMON_LIST), CCB
#DC_DAEMON_LIST = $(DC_DAEMON_LIST) +CCB

# -public is the address peers put in their CCB contacts, so it has to be the
# one they can reach -- not a wildcard, and not a private address if the EPs
# are elsewhere.
#CCB_ARGS = -listen :9618 -public ccb.example.org:9618

# --- logging ---------------------------------------------------------------
CCB_LOG     = $(LOG)/CcbLog
MAX_CCB_LOG = 10000000
#CCB_DEBUG   = D_FULLDEBUG D_SECURITY

# --- replacing the collector's built-in CCB --------------------------------
# A pool needs one broker, not two. If this daemon is the pool's CCB, turn the
# collector's off; if you are adding this one alongside an existing collector
# CCB for a subset of machines, leave it on and point only those machines here.
#ENABLE_CCB_SERVER = False

# --- what registers and what may ask ---------------------------------------
# CCB_REGISTER is authorized at DAEMON (the daemons that register themselves),
# CCB_REQUEST at READ (whoever wants to reach one). The defaults inherited from
# the pool configuration are usually right; narrow them here if not.
#ALLOW_DAEMON = ...
#ALLOW_READ   = ...
# condor_reconfig of this daemon is authorized at ADMINISTRATOR.
#ALLOW_ADMINISTRATOR_CCB = $(ALLOW_ADMINISTRATOR)

# --- surviving a restart ---------------------------------------------------
# Registered targets keep their CCBID, and clients resume security sessions,
# across a broker restart. Without this both are lost and every EP re-registers
# under a new contact. Naming the file in VALID_SPOOL_FILES keeps condor_preen
# from removing something it does not recognise.
#CCB_SESSION_CACHE_FILE = $(SPOOL)/htc-ccb-sessions.db
#VALID_SPOOL_FILES      = $(VALID_SPOOL_FILES) htc-ccb-sessions.db*

# --- dial policy -----------------------------------------------------------
# Refuse reverse connects to loopback and link-local addresses. The address is
# supplied by the requester, so this is worth turning on wherever the brokered
# daemons are not all trusted. (The outbound proxy refuses them regardless.)
#CCB_DIAL_REFUSE_LOCAL_ADDRESSES = true

# A reconnecting target must come from the IP it registered from. Set this only
# where targets legitimately change address, e.g. behind a NAT pool.
#CCB_RECONNECT_ALLOWED_FROM_ANY_IP = false

# --- tunneling an EP with no outbound network ------------------------------
# Only for the broker pair described in ADMIN_TUNNELING.md; an ordinary CCB
# needs none of it.
#
# On the broker beside the pool (the "outside" broker):
#CCB_CARRIER_LISTEN            = wss://0.0.0.0:443/ccb/tunnel
#CCB_CARRIER_TLS_CERT          = /etc/condor/ccb/tls.crt
#CCB_CARRIER_TLS_KEY           = /etc/condor/ccb/tls.key
#CCB_OUTBOUND_PROXY            = true
#CCB_OUTBOUND_TARGET_ALLOWLIST = collector.example.org, *.ap.example.org
#
# On the broker on the worker node (the "inside" broker):
#CCB_OUTBOUND_NEXT_HOP   = wss://ccb.example.org:443/ccb/tunnel
#CCB_CARRIER_PROXY       = http://squid.site.example:3128
#CCB_CARRIER_CA_FILE     = /etc/condor/ccb/ca.crt
#CCB_OUTBOUND_PROXY      = true
#CCB_TUNNEL_READY_FILE   = $(LOG)/ccb-tunnel-ready
