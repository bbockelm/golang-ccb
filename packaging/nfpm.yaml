# Package definition for htc-ccb, built by packaging/build-rpm.sh.
name: htc-ccb
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
version_schema: none
section: net
priority: optional
maintainer: ${PKG_MAINTAINER}
description: |
  Connection broker (CCB) for HTCondor.

  Makes daemons behind NAT or a private network reachable, using the same
  wire protocol as the CCB embedded in condor_collector. Additionally
  tunnels an execution point that has no outbound network through a single
  proxied connection. Runs as a DaemonCore daemon under condor_master.
vendor: ${PKG_VENDOR}
homepage: https://github.com/bbockelm/golang-ccb
license: Apache-2.0

# No hard dependency on HTCondor. This is a self-contained static binary: it
# reads the pool's configuration and credentials as files and invokes no
# HTCondor tool, and it runs standalone from -listen/-public. HTCondor is only
# recommended because the usual deployment has condor_master supervise it, and
# because the pool it brokers for is made of HTCondor daemons.
recommends:
  - condor

contents:
  # Staged here by build-rpm.sh (PKG_STAGE) rather than named through a
  # variable: nfpm expands environment variables in its scalar fields but
  # globs contents.src literally, so a ${...} here silently matches no files.
  # This path and PKG_STAGE are one fact written twice; keep them together.
  - src: packaging/staging/htc-ccb
    dst: /usr/sbin/htc-ccb
    file_info:
      mode: 0755

  - src: packaging/htc-ccb.conf
    dst: /etc/condor/config.d/50-htc-ccb.conf
    type: config|noreplace
    file_info:
      mode: 0644

  - src: README.md
    dst: /usr/share/doc/htc-ccb/README.md
    type: doc
    file_info:
      mode: 0644

  - src: docs/ADMIN_TUNNELING.md
    dst: /usr/share/doc/htc-ccb/ADMIN_TUNNELING.md
    type: doc
    file_info:
      mode: 0644

rpm:
  group: System Environment/Daemons
  # Compression every EL8+ host can read.
  compression: gzip
