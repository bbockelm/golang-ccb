# The site proxy, configured the way an HPC site's would be. The three ACLs that
# matter are not inventions: they are what a stock squid.conf ships with
# (SSL_ports/Safe_ports and the CONNECT method), plus the destination allow-list
# a site adds when it permits outbound traffic to named hosts only.
#
# Getting these from a real squid rather than an in-process stand-in is the whole
# reason this tier exists: they are what decides whether a deployment works, and
# the health check's advice is only worth having if it names the rule that fired.

acl localnet src 172.16.0.0/12

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# The site approves destinations by name. Everything else is refused.
acl approved_dst dstdomain ccb.offsite.test

http_access deny !Safe_ports
# Stock rule. It is why the carrier must listen on 443 and nowhere else.
http_access deny CONNECT !SSL_ports
http_access deny CONNECT !approved_dst
http_access allow CONNECT approved_dst localnet
http_access deny all

http_port 3128

# stdio rather than the buffering daemon helper, so the harness reads entries
# as they happen instead of racing the flush.
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache deny all

# Deliberately short, so an idle tunnel has to survive something.
read_timeout 1 minute

# Containers come and go; do not spend 30s on a DNS retry when a name is bogus.
negative_dns_ttl 1 second
dns_timeout 5 seconds
shutdown_lifetime 1 second
